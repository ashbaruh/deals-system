# Deals run: twice a day (starts ≈09:30 and 20:30 Israel time in winter, posts ~30 min later), up to 5 deals per channel each.
# Fetches feeds, picks deals, posts to Telegram, rebuilds the site and commits it.
# Cloudflare Pages is connected to this repo and redeploys the public/ folder on every commit.
name: Deals run

on:
  schedule:
    - cron: "30 7,18 * * *"
    - cron: "50 9,14,20 * * *"   # backup: GitHub sometimes drops scheduled runs; daily caps stop double posting
  workflow_dispatch:
    inputs:
      seed:
        description: "One-time fill: post up to 20 deals per channel"
        type: boolean
        default: false
      preview:
        description: "Review mode: send picks privately to the owner, publish nothing"
        type: boolean
        default: false
      publish_preview:
        description: "Publish the picks saved by the last preview run (no feed download)"
        type: boolean
        default: false
      retranslate:
        description: "Translate titles already on the site (no feed download)"
        type: boolean
        default: false
      delta_hours:
        description: "Test: download only products changed in the last N hours (0 = full feed)"
        type: string
        default: "0"
      only_niche:
        description: "Targeted fill: only this niche (e.g. brands), site-only, no posts"
        type: string
        default: ""
      cleanup:
        description: "Delete the bot's channel posts after the welcome message (48h limit) and reset the archive"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: deals-run
  cancel-in-progress: false

jobs:
  # The full feed gets cut off by the server (~45% arrives). The same catalogue is also
  # offered in price buckets that each finish: fetch them in parallel, then run once.
  fetch:
    if: ${{ !inputs.retranslate && !inputs.publish_preview && !inputs.cleanup && (inputs.delta_hours == '' || inputs.delta_hours == '0' || inputs.delta_hours == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        feed: [14107, 14267, 14280, 14281, 14282, 14283, 14284, 14285, joom]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch bucket
        env:
          PYTHONUNBUFFERED: "1"
          FEEDS_EN: ${{ secrets.FEEDS_EN }}
        run: python -m engine.fetch ${{ matrix.feed }}
      - uses: actions/upload-artifact@v4
        with:
          name: products-${{ matrix.feed }}
          path: cache/products_*.json.gz
          retention-days: 1

  run:
    needs: fetch
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Get fetched buckets
        if: ${{ needs.fetch.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: products-*
          path: cache
          merge-multiple: true
      - name: Restore price history
        uses: actions/cache/restore@v4
        with:
          path: data/history.sqlite
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Run engine
        env:
          PYTHONUNBUFFERED: "1"
          SEED: ${{ inputs.seed && '1' || '0' }}
          CLEANUP: ${{ inputs.cleanup && '1' || '0' }}
          PREVIEW: ${{ inputs.preview && '1' || '0' }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview && '1' || '0' }}
          RETRANSLATE: ${{ inputs.retranslate && '1' || '0' }}
          ONLY_NICHE: ${{ inputs.only_niche }}
          FEED_CACHE_DIR: cache
          FEED_DELTA_HOURS: ${{ inputs.delta_hours || '0' }}
          FEEDS_HE: ${{ secrets.FEEDS_HE }}
          FEEDS_ES: ${{ secrets.FEEDS_ES }}
          FEEDS_EN: ${{ secrets.FEEDS_EN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_HE: "@mivtzaim_kuponim"
          TELEGRAM_CHANNEL_ES: "@ofertas_descuentos_es"
          TELEGRAM_CHANNEL_EN: "@discount_deals_promo"
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          CLICK_BASE_URL: ${{ vars.CLICK_BASE_URL }}
        run: python -m engine.run
      - name: Save price history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/history.sqlite
          key: history-${{ github.run_id }}
      - name: Commit site
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          # Commit this run's output on top of the latest main (code may have changed meanwhile).
          tmp=$(mktemp -d); cp -r data public "$tmp"/
          git fetch -q origin main && git reset -q --hard origin/main
          rm -rf public && cp -r "$tmp"/public . && find data -name "*.json" -delete && cp -r "$tmp"/data/. data/
          rm -f data/history.sqlite
          git add -A data public
          git diff --cached --quiet || git commit -q -m "Deals run $(date -u +%F_%H%M)"
          git push -q || (git fetch -q origin main && git rebase -X ours origin/main && git push -q)
