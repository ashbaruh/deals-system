name: Promo video
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages (space separated)"
        default: "he es en"
      pid:
        description: "Single-product promo: deal pid (empty = 11.11 multi video)"
        default: ""
      names:
        description: "JSON {lang: short name} for the single product"
        default: "{}"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: |
          which ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          pip install -q playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -yq fonts-noto-color-emoji
      - name: Render
        env:
          PID: ${{ inputs.pid }}
          NAMES: ${{ inputs.names }}
        run: if [ -n "$PID" ]; then python -m video.single ${{ inputs.langs }}; else python -m video.make ${{ inputs.langs }}; fi
      - name: Push to media branch
        run: |
          cd out && rm -rf tmp && git init -q -b media && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "promo video"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
      - uses: actions/upload-artifact@v4
        with:
          name: promo-video
          path: |
            out/video_*.mp4
            out/cover_*.png
