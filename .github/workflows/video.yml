name: Promo video
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages (space separated)"
        default: "he es en"
      pid:
        description: "Single-product promo: deal pid (empty = 11.11 multi video)"
        default: ""
      names:
        description: "JSON {lang: short name} for the single product"
        default: "{}"
      daily:
        description: "Daily top-3 video (ignores pid)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        timeout-minutes: 8
        run: |
          which ffmpeg || { pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")" /usr/local/bin/ffmpeg; }
          pip install -q playwright
          python -m playwright install chromium || timeout 300 python -m playwright install --with-deps chromium
      - name: Render
        env:
          PID: ${{ inputs.pid }}
          NAMES: ${{ inputs.names }}
          DAILY: ${{ inputs.daily }}
        run: if [ "$DAILY" = "true" ]; then python -m video.daily ${{ inputs.langs }}; elif [ -n "$PID" ]; then python -m video.single ${{ inputs.langs }}; else python -m video.make ${{ inputs.langs }}; fi
      - name: Push to media branch
        run: |
          cd out && rm -rf tmp && git init -q -b media && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "promo video"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
      - uses: actions/upload-artifact@v4
        with:
          name: promo-video
          path: |
            out/video_*.mp4
            out/cover_*.png
