name: probe
on:
  workflow_dispatch:
    inputs:
      feed: {description: "Admitad feed id", required: true}
      rows: {description: "max rows", default: "300000"}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt || true
      - run: python -m engine.probe ${{ inputs.feed }} ${{ inputs.rows }}
        env:
          FEEDS_EN: ${{ secrets.FEEDS_EN }}
