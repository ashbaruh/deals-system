name: Live deals stream
# Renders a 10-minute 16:9 deals video, publishes the short links dealim.net/l/N,
# then (stream=true) pushes it to YouTube Live over RTMP. Needs secret YT_STREAM_KEY.
on:
  schedule:
    - cron: "37 17 * * *"   # daily: render ~20 min, go live ~20:05 Israel (scheduled broadcast on the default key)
  workflow_dispatch:
    inputs:
      lang:
        description: "en or es"
        default: "en"
      target:
        description: "youtube (all deals) or twitch (gaming gear, [Rerun])"
        default: "youtube"
      stream:
        description: "Go live after rendering"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: live
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        timeout-minutes: 8
        run: |
          which ffmpeg || { pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")" /usr/local/bin/ffmpeg; }
          pip install -q playwright pillow numpy scipy
          python -m playwright install chromium || timeout 300 python -m playwright install --with-deps chromium
      - name: Render
        env:
          LIVE_THEME: ${{ inputs.target == 'twitch' && 'gaming' || '' }}
          LIVE_PREFIX: ${{ inputs.target == 'twitch' && 'g' || 'l' }}
          LIVE_PER: ${{ inputs.target == 'twitch' && '12' || '15' }}
          LIVE_MIN: ${{ inputs.target == 'twitch' && '20' || '10' }}
        run: mkdir -p out && python -m video.live ${{ inputs.lang || 'en' }} && cat out/live_description_${{ inputs.lang || 'en' }}.txt
      - name: Publish short links
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add -f data/live_links*.json public/l public/g 2>/dev/null || git add -f data/live_links*.json public/l
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "Live stream short links" || exit 0
          git push -q || (git fetch -q origin main && git rebase -X theirs origin/main && git push -q)
      - uses: actions/upload-artifact@v4
        with:
          name: live-${{ inputs.lang || 'en' }}
          path: |
            out/live_*.mp4
            out/live_*.png
            out/live_description_*.txt
      - name: Stream to YouTube
        if: ${{ inputs.stream || github.event_name == 'schedule' }}
        env:
          YT: ${{ secrets.YT_STREAM_KEY }}
          TW: ${{ secrets.TWITCH_STREAM_KEY }}
          TARGET: ${{ inputs.target || 'youtube' }}
        run: |
          if [ "$TARGET" = twitch ]; then URL="rtmp://live.twitch.tv/app/$TW"; KEY="$TW"; LOOP=2; else URL="rtmp://x.rtmp.youtube.com/live2/$YT"; KEY="$YT"; LOOP=0; fi
          test -n "$KEY" || { echo "stream key secret missing for $TARGET"; exit 1; }
          sleep 150   # let Cloudflare publish the short links
          ffmpeg -loglevel warning -re -stream_loop $LOOP -i out/live_${{ inputs.lang || 'en' }}.mp4 -c copy -f flv "$URL"
